name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests benchmarks
      - run: ruff format --check src tests benchmarks
      - run: mypy src

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System libraries for OpenCV (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,pdf]"
      - name: Unit tests with coverage gate (no OCR models)
        run: pytest -m "not ocr" --cov=docling_pk --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          name: coverage-xml
          path: coverage.xml

  integration:
    name: End-to-end OCR tests (RapidOCR on synthetic fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System libraries for OpenCV (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,pdf]"
      - run: pytest -m ocr -v
      - name: Synthetic benchmark
        run: python benchmarks/run_benchmark.py tests/fixtures/synthetic/labels.json --backend rapidocr --out benchmark_synthetic.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-synthetic
          path: benchmark_synthetic.json

  package:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries for OpenCV (Linux)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel in a clean environment and smoke-test it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/python -c "import docling_pk; print(docling_pk.__version__)"
          /tmp/clean/bin/docling-pk --version
          /tmp/clean/bin/docling-pk extract "$GITHUB_WORKSPACE/tests/fixtures/synthetic/00_cnic_front_clean.jpg" --type cnic --no-verify --no-urdu
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
