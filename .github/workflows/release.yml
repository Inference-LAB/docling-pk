name: Release to PyPI

# Publishes when a version tag (v1.0.0, v1.1.0, ...) is pushed.
# Uses PyPI Trusted Publishing: no API token is stored in GitHub. One-time
# setup on pypi.org: Account -> Publishing -> add a pending publisher with
# owner "Inference-LAB", repository "docling-pk", workflow "release.yml",
# environment "pypi".

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Tag matches package version
        run: |
          VERSION=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/docling_pk/__init__.py').read_text()).group(1))")
          test "v$VERSION" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != package version v$VERSION"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
